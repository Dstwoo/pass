<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#dc2626">
    <title>Carnet Ambulancier V5</title>
    
    <!-- Tailwind CSS (Via CDN pour rester en un seul fichier) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration Tailwind pour le mode sombre -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#dc2626', // Rouge Urgence
                        secondary: '#2563eb', // Bleu Samusocial/Ambu
                        darkbg: '#18181b', // Zinc 900
                        carddark: '#27272a', // Zinc 800
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome pour les icônes (SVG légers) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Styles spécifiques non gérés par Tailwind */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Empêche le rebond sur mobile */
        }
        
        /* Masquer la scrollbar tout en gardant le scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        /* Animation pour les Toasts et Modales */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .toast-anim {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .modal-anim {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-darkbg dark:text-gray-100 transition-colors duration-300 min-h-screen pb-24">

    <!-- En-tête Fixe -->
    <header class="fixed top-0 left-0 right-0 bg-primary text-white shadow-lg z-50 transition-all duration-300">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                    <i class="fa-solid fa-truck-medical text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Carnet V5</h1>
                    <p class="text-xs text-red-100 opacity-90" id="header-stats">Chargement...</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-white/10 active:scale-95 transition-transform" aria-label="Thème">
                <i class="fa-solid fa-moon text-xl dark:hidden"></i>
                <i class="fa-solid fa-sun text-xl hidden dark:block text-yellow-300"></i>
            </button>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-3xl mx-auto px-4 pt-20">
        
        <!-- Carte GPS & Recherche -->
        <div class="bg-white dark:bg-carddark rounded-xl shadow-sm p-4 mb-4 border border-gray-100 dark:border-gray-700">
            <!-- GPS Status -->
            <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-100 dark:border-gray-700">
                <div class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                    <i class="fa-solid fa-location-crosshairs text-primary"></i>
                    <span id="gps-status">Recherche GPS...</span>
                </div>
                <button onclick="updateLocation()" class="text-primary hover:bg-red-50 dark:hover:bg-red-900/20 px-3 py-1 rounded-full text-xs font-bold border border-primary transition-colors">
                    Actualiser
                </button>
            </div>

            <!-- Barre de recherche -->
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" 
                    class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg pl-10 pr-4 py-3 text-base focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                    placeholder="Rechercher (Nom, Ville...)" oninput="filterAndRenderPlaces()">
            </div>

            <!-- Filtres Rapides -->
            <div class="grid grid-cols-2 gap-2 mt-3">
                <select id="type-filter" onchange="filterAndRenderPlaces()" class="bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none">
                    <option value="">🏥 Tous types</option>
                    <option value="Hôpital">Hôpital</option>
                    <option value="Clinique">Clinique</option>
                    <option value="Résidence">Résidence</option>
                    <option value="EHPAD">Maison de retraite</option>
                    <option value="Parking">Parking</option>
                    <option value="Autre">Autre</option>
                </select>
                <select id="dist-filter" onchange="filterAndRenderPlaces()" class="bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 text-sm outline-none">
                    <option value="0">🌍 Toute distance</option>
                    <option value="0.2">📍 &lt; 200 m</option>
                    <option value="5">📍 &lt; 5 km</option>
                    <option value="20">📍 &lt; 20 km</option>
                </select>
            </div>
        </div>

        <!-- Bouton Outils (Accès rapide) -->
        <button onclick="toggleTools()" class="w-full mb-4 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 flex items-center justify-center gap-2 hover:text-primary transition-colors">
            <i class="fa-solid fa-sliders"></i> Options de sauvegarde & partage
        </button>

        <!-- Panel Outils (Caché par défaut) -->
        <div id="tools-panel" class="hidden bg-gray-50 dark:bg-gray-800 rounded-xl p-4 mb-4 border border-gray-200 dark:border-gray-700">
            <h3 class="font-bold text-gray-700 dark:text-gray-200 mb-3">Gestion de base de données</h3>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="shareGlobalData()" class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition-colors">
                    <i class="fa-brands fa-whatsapp"></i> Partager Tout
                </button>
                <button onclick="exportData()" class="flex items-center justify-center gap-2 bg-gray-600 text-white py-2 rounded-lg hover:bg-gray-700 transition-colors">
                    <i class="fa-solid fa-download"></i> Sauvegarder
                </button>
            </div>

            <div class="border-t border-gray-200 dark:border-gray-600 pt-3">
                <p class="text-xs text-gray-500 mb-2">📥 Importer un fichier reçu :</p>
                
                <button onclick="triggerImport('merge')" class="w-full mb-3 flex flex-col items-center justify-center gap-1 bg-blue-100 text-blue-700 hover:bg-blue-200 dark:bg-blue-900/40 dark:hover:bg-blue-900/60 dark:text-blue-200 py-3 rounded-xl font-bold transition-colors border border-blue-200 dark:border-blue-800">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-plus-circle"></i> Importer / Fusionner</span>
                    <span class="text-[10px] font-normal opacity-80">(Ajoute les nouveaux & Demande si conflit)</span>
                </button>

                <div class="flex justify-end mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                     <button onclick="triggerImport('replace')" class="text-xs text-red-500 hover:text-red-700 dark:text-red-400 underline">
                        ⚠️ Restaurer sauvegarde externe (Remplace tout)
                    </button>
                </div>
                
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="processImportFile(this)">
            </div>
        </div>

        <!-- Liste des Lieux -->
        <div id="places-list" class="space-y-3 pb-20">
            <!-- Injecté par JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
            <div class="w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400 text-3xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <p class="text-gray-500 dark:text-gray-400">Aucun lieu trouvé.</p>
            <p class="text-xs text-gray-400 mt-2">Commencez par ajouter un lieu ou importer une sauvegarde.</p>
        </div>
    </main>

    <!-- FAB (Floating Action Button) -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-primary text-white rounded-full shadow-lg shadow-red-600/30 flex items-center justify-center text-2xl hover:scale-105 active:scale-95 transition-all z-40">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal Formulaire -->
    <div id="modal-form" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 md:top-1/2 md:left-1/2 md:bottom-auto md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-lg bg-white dark:bg-carddark rounded-t-2xl md:rounded-2xl p-6 modal-anim max-h-[90vh] overflow-y-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold" id="modal-title">Nouveau Lieu</h2>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <form id="place-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="place-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nom du lieu</label>
                    <input type="text" id="nom_lieu" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 outline-none focus:border-primary" placeholder="Ex: Résidence Les Lilas">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Type</label>
                        <select id="type_lieu" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 outline-none">
                            <option value="Résidence">Résidence</option>
                            <option value="Hôpital">Hôpital</option>
                            <option value="Clinique">Clinique</option>
                            <option value="EHPAD">EHPAD</option>
                            <option value="Parking">Parking</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Ville</label>
                        <input type="text" id="ville" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 outline-none focus:border-primary" placeholder="Paris">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Adresse</label>
                    <input type="text" id="adresse" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 outline-none focus:border-primary" placeholder="12 rue de la Paix">
                </div>

                <div class="bg-red-50 dark:bg-red-900/10 p-3 rounded-lg border border-red-100 dark:border-red-900/30">
                    <label class="block text-xs font-bold text-primary uppercase mb-2">🔐 Codes d'accès</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="code_entree_principal" class="w-full bg-white dark:bg-gray-900 border border-red-200 dark:border-red-900/50 rounded-lg p-3 text-center font-mono font-bold text-lg outline-none focus:ring-2 focus:ring-red-500" placeholder="Portail">
                        <input type="text" id="code_secondaire" class="w-full bg-white dark:bg-gray-900 border border-red-200 dark:border-red-900/50 rounded-lg p-3 text-center font-mono text-lg outline-none focus:ring-2 focus:ring-red-500" placeholder="Hall / Bis">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Commentaire</label>
                    <textarea id="commentaire" rows="2" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 outline-none focus:border-primary" placeholder="Bâtiment B, 3ème étage..."></textarea>
                </div>

                <!-- GPS caché mais rempli -->
                <div class="flex items-center justify-between bg-gray-50 dark:bg-gray-800 p-3 rounded-lg">
                    <div class="text-sm">
                        <span id="gps-coords-display" class="text-gray-500">Pas de GPS enregistré</span>
                        <input type="hidden" id="latitude">
                        <input type="hidden" id="longitude">
                    </div>
                    <button type="button" onclick="fillGPSForm()" class="text-sm bg-gray-200 dark:bg-gray-700 px-3 py-1.5 rounded-md hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                        <i class="fa-solid fa-location-dot mr-1"></i> Ma position
                    </button>
                </div>

                <div class="pt-2 grid grid-cols-2 gap-3">
                    <button type="button" onclick="closeModal()" class="py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Annuler</button>
                    <button type="submit" class="py-3 rounded-xl font-bold bg-primary text-white hover:bg-red-700 shadow-lg shadow-red-500/20 transition-colors">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Confirmation Suppression -->
    <div id="modal-confirm" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
        <div class="relative bg-white dark:bg-carddark rounded-2xl p-6 max-w-sm w-full shadow-2xl modal-anim text-center">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600 dark:text-red-400 text-2xl">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 class="text-lg font-bold mb-2">Supprimer ce lieu ?</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Cette action est irréversible.</p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeConfirm()" class="py-2.5 rounded-xl font-medium bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">Annuler</button>
                <button id="confirm-btn" class="py-2.5 rounded-xl font-bold bg-red-600 text-white shadow-lg shadow-red-600/20">Supprimer</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900/90 dark:bg-white/90 text-white dark:text-gray-900 px-6 py-3 rounded-full shadow-xl z-[70] hidden items-center gap-3 backdrop-blur-md">
        <span id="toast-icon"></span>
        <span id="toast-message" class="text-sm font-medium">Notification</span>
    </div>

    <script>
        // --- ETAT ET DONNEES ---
        let places = [];
        let currentPosition = null;
        let deleteTargetId = null;

        // --- THEME & INIT ---
        function initTheme() {
            const stored = localStorage.getItem('theme');
            const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && sysDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        // --- PERSISTANCE ---
        function loadData() {
            try {
                const stored = localStorage.getItem('ambu_codes_db');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed && parsed.length > 0) {
                        places = parsed.map(normalizePlace);
                    } else {
                        places = []; // Base vide par défaut
                    }
                } else {
                    places = []; // Base vide par défaut
                }
            } catch (e) {
                console.error("Erreur chargement", e);
                places = [];
            }
            updateStats();
        }

        function normalizePlace(p) {
             return {
                id: p.id,
                nom_lieu: p.nom_lieu || p.nom || "Inconnu",
                type_lieu: (p.type_lieu || p.type) === 'Maison de retraite / EHPAD' ? 'EHPAD' : (p.type_lieu || p.type || "Autre"),
                adresse: p.adresse || "",
                ville: p.ville || "",
                code_entree_principal: p.code_entree_principal || p.code1 || "",
                code_secondaire: p.code_secondaire || p.code2 || "",
                commentaire: p.commentaire || p.note || "",
                latitude: parseFloat(p.latitude || p.lat),
                longitude: parseFloat(p.longitude || p.lon),
                date_maj: p.date_maj || p.updated || new Date().toISOString()
            };
        }

        function saveData() {
            localStorage.setItem('ambu_codes_db', JSON.stringify(places));
            updateStats();
        }

        function updateStats() {
            document.getElementById('header-stats').innerText = `${places.length} lieux enregistrés`;
        }

        // --- GPS ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updateLocation() {
            const statusEl = document.getElementById('gps-status');
            statusEl.innerText = "Recherche...";
            statusEl.className = "text-yellow-600 dark:text-yellow-400 animate-pulse";
            
            if (!navigator.geolocation) {
                statusEl.innerText = "GPS non supporté";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentPosition = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    statusEl.innerText = "Position GPS OK";
                    statusEl.className = "text-green-600 dark:text-green-400 font-bold";
                    filterAndRenderPlaces();
                },
                (err) => {
                    console.error(err);
                    statusEl.innerText = "Erreur GPS";
                    statusEl.className = "text-red-500";
                    showToast("Impossible d'obtenir la position", "error");
                    filterAndRenderPlaces(); 
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // --- RENDER ---
        function formatDist(km) {
            if (km === Infinity || isNaN(km)) return "";
            if (km < 1) return `<span class="text-green-600 dark:text-green-400 font-bold text-xs"><i class="fa-solid fa-person-walking"></i> ${Math.round(km * 1000)} m</span>`;
            return `<span class="text-blue-600 dark:text-blue-400 font-bold text-xs"><i class="fa-solid fa-car"></i> ${km.toFixed(1)} km</span>`;
        }

        function getIconForType(type) {
            switch(type) {
                case 'Hôpital': return 'fa-hospital text-red-500';
                case 'Clinique': return 'fa-heart-pulse text-pink-500';
                case 'Résidence': return 'fa-building text-blue-500';
                case 'EHPAD': return 'fa-wheelchair text-orange-500';
                case 'Parking': return 'fa-square-parking text-gray-500';
                default: return 'fa-map-pin text-gray-400';
            }
        }

        function filterAndRenderPlaces() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const typeFilter = document.getElementById('type-filter').value;
            const distFilter = parseFloat(document.getElementById('dist-filter').value);

            let filtered = places.map(p => {
                let dist = Infinity;
                if (currentPosition && p.latitude && p.longitude) {
                    dist = calculateDistance(currentPosition.lat, currentPosition.lon, p.latitude, p.longitude);
                }
                return { ...p, _dist: dist };
            });

            filtered = filtered.filter(p => {
                const matchTerm = (p.nom_lieu || "").toLowerCase().includes(term) || 
                                  (p.ville || "").toLowerCase().includes(term);
                const matchType = !typeFilter || p.type_lieu === typeFilter;
                const matchDist = distFilter === 0 || p._dist <= distFilter;
                return matchTerm && matchType && matchDist;
            });

            // Tri : Distance si dispo, sinon Nom
            if (currentPosition) {
                filtered.sort((a, b) => a._dist - b._dist);
            } else {
                filtered.sort((a, b) => (a.nom_lieu || "").localeCompare(b.nom_lieu || ""));
            }

            const container = document.getElementById('places-list');
            container.innerHTML = '';

            if (filtered.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            filtered.forEach(p => {
                const iconClass = getIconForType(p.type_lieu);
                const distBadge = formatDist(p._dist);
                
                const wazeUrl = (p.latitude && p.longitude) ? `https://waze.com/ul?ll=${p.latitude},${p.longitude}&navigate=yes` : null;
                const mapsUrl = (p.latitude && p.longitude) 
                    ? `https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}` 
                    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse + ' ' + p.ville)}`;

                const html = `
                <div class="bg-white dark:bg-carddark rounded-xl p-4 shadow-sm border-l-4 border-primary hover:shadow-md transition-shadow relative overflow-hidden group">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 w-8 h-8 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center shrink-0">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg leading-tight">${p.nom_lieu}</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400">${p.adresse} ${p.ville}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] uppercase font-bold tracking-wider bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-500">${p.type_lieu}</span>
                                    ${distBadge}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="editPlace('${p.id}')" class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Bloc Codes -->
                    <div class="flex flex-col gap-2 my-3">
                        ${p.code_entree_principal ? `
                        <div onclick="copyCode('${p.code_entree_principal}')" class="bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg p-3 flex justify-between items-center cursor-pointer active:scale-[0.98] transition-transform">
                            <span class="text-xs font-bold text-gray-500 uppercase">Portail</span>
                            <div class="flex items-center gap-3">
                                <span class="font-mono text-xl font-bold tracking-wider text-primary">${p.code_entree_principal}</span>
                                <i class="fa-regular fa-copy text-gray-400"></i>
                            </div>
                        </div>` : ''}
                        
                        ${p.code_secondaire ? `
                        <div onclick="copyCode('${p.code_secondaire}')" class="bg-gray-50 dark:bg-gray-900/50 border border-dashed border-gray-300 dark:border-gray-700 rounded-lg p-2 flex justify-between items-center cursor-pointer active:scale-[0.98] transition-transform">
                            <span class="text-xs font-bold text-gray-500 uppercase">Hall / Bis</span>
                            <div class="flex items-center gap-3">
                                <span class="font-mono text-lg font-bold text-gray-700 dark:text-gray-300">${p.code_secondaire}</span>
                                <i class="fa-regular fa-copy text-gray-400"></i>
                            </div>
                        </div>` : ''}
                    </div>

                    ${p.commentaire ? `<div class="bg-yellow-50 dark:bg-yellow-900/10 p-2 rounded text-sm text-yellow-800 dark:text-yellow-200 mb-3 border border-yellow-100 dark:border-yellow-900/30"><i class="fa-regular fa-note-sticky mr-1"></i> ${p.commentaire}</div>` : ''}

                    <!-- Actions -->
                    <div class="flex items-center gap-2 mt-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                        ${wazeUrl ? `<a href="${wazeUrl}" target="_blank" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 dark:bg-blue-900/30 dark:hover:bg-blue-900/50 dark:text-blue-300 py-2 rounded-lg text-center text-sm font-bold transition-colors"><i class="fa-brands fa-waze mr-1"></i> Waze</a>` : ''}
                        <a href="${mapsUrl}" target="_blank" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-gray-200 py-2 rounded-lg text-center text-sm font-bold transition-colors"><i class="fa-solid fa-map-location-dot mr-1"></i> Maps</a>
                        <button onclick="sharePlaceAsFile('${p.id}')" class="w-10 h-10 flex items-center justify-center rounded-lg text-blue-600 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/20 dark:hover:bg-blue-900/40 transition-colors" title="Transférer ce lieu (Fichier)">
                            <i class="fa-solid fa-share-nodes text-lg"></i>
                        </button>
                        <button onclick="sharePlace('${p.id}')" class="w-10 h-10 flex items-center justify-center rounded-lg text-green-600 bg-green-50 hover:bg-green-100 dark:bg-green-900/20 dark:hover:bg-green-900/40 transition-colors">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </button>
                         <button onclick="askDelete('${p.id}')" class="w-10 h-10 flex items-center justify-center rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // --- ACTIONS ---
        async function copyCode(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(`Code ${text} copié !`, 'success');
            } catch (err) {
                // Fallback ancien navigateur
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast(`Code ${text} copié !`, 'success');
            }
        }

        function toggleTools() {
            document.getElementById('tools-panel').classList.toggle('hidden');
        }

        function resetFilters() {
            document.getElementById('search-input').value = "";
            document.getElementById('type-filter').value = "";
            document.getElementById('dist-filter').value = "0";
            filterAndRenderPlaces();
        }

        // --- MODALES ---
        function openModal(isEdit = false) {
            const modal = document.getElementById('modal-form');
            modal.classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('place-form').reset();
                document.getElementById('place-id').value = '';
                document.getElementById('modal-title').innerText = "Ajouter un lieu";
                document.getElementById('gps-coords-display').innerText = "Pas de GPS enregistré";
                // Auto fill GPS if available
                if(currentPosition) fillGPSForm();
            }
        }

        function closeModal() {
            document.getElementById('modal-form').classList.add('hidden');
        }

        function fillGPSForm() {
            if (currentPosition) {
                document.getElementById('latitude').value = currentPosition.lat;
                document.getElementById('longitude').value = currentPosition.lon;
                document.getElementById('gps-coords-display').innerText = `${currentPosition.lat.toFixed(4)}, ${currentPosition.lon.toFixed(4)}`;
                document.getElementById('gps-coords-display').className = "text-green-600 dark:text-green-400 font-mono text-sm";
            } else {
                showToast("Activez le GPS d'abord", "error");
                updateLocation();
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('place-id').value;
            const lat = document.getElementById('latitude').value;
            const lon = document.getElementById('longitude').value;

            const placeData = {
                id: id || Date.now().toString(36) + Math.random().toString(36).substr(2),
                nom_lieu: document.getElementById('nom_lieu').value,
                type_lieu: document.getElementById('type_lieu').value,
                adresse: document.getElementById('adresse').value,
                ville: document.getElementById('ville').value,
                code_entree_principal: document.getElementById('code_entree_principal').value,
                code_secondaire: document.getElementById('code_secondaire').value,
                commentaire: document.getElementById('commentaire').value,
                latitude: lat ? parseFloat(lat) : null,
                longitude: lon ? parseFloat(lon) : null,
                date_maj: new Date().toISOString()
            };

            if (id) {
                const idx = places.findIndex(p => p.id === id);
                if (idx !== -1) places[idx] = placeData;
            } else {
                places.push(placeData);
            }

            saveData();
            closeModal();
            filterAndRenderPlaces();
            showToast(id ? "Lieu modifié" : "Lieu ajouté", "success");
        }

        function editPlace(id) {
            const p = places.find(place => place.id === id);
            if (!p) return;

            document.getElementById('place-id').value = p.id;
            document.getElementById('nom_lieu').value = p.nom_lieu;
            document.getElementById('type_lieu').value = p.type_lieu;
            document.getElementById('adresse').value = p.adresse;
            document.getElementById('ville').value = p.ville;
            document.getElementById('code_entree_principal').value = p.code_entree_principal;
            document.getElementById('code_secondaire').value = p.code_secondaire;
            document.getElementById('commentaire').value = p.commentaire;
            document.getElementById('latitude').value = p.latitude || '';
            document.getElementById('longitude').value = p.longitude || '';
            
            if(p.latitude) {
                document.getElementById('gps-coords-display').innerText = `${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}`;
                document.getElementById('gps-coords-display').className = "text-blue-600 font-mono text-sm";
            } else {
                 document.getElementById('gps-coords-display').innerText = "Pas de GPS";
                 document.getElementById('gps-coords-display').className = "text-gray-500";
            }

            document.getElementById('modal-title').innerText = "Modifier";
            openModal(true);
        }

        // --- SUPPRESSION ---
        function askDelete(id) {
            deleteTargetId = id;
            document.getElementById('modal-confirm').classList.remove('hidden');
            document.getElementById('confirm-btn').onclick = confirmDelete;
        }

        function closeConfirm() {
            document.getElementById('modal-confirm').classList.add('hidden');
            deleteTargetId = null;
        }

        function confirmDelete() {
            if (deleteTargetId) {
                places = places.filter(p => p.id !== deleteTargetId);
                saveData();
                filterAndRenderPlaces();
                showToast("Lieu supprimé", "success");
            }
            closeConfirm();
        }

        // --- IMPORT / EXPORT (LOGIQUE CONSERVÉE) ---
        function exportData() {
            const dataStr = JSON.stringify(places, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_ambu_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("Sauvegarde téléchargée", "success");
        }

        function shareGlobalData() {
            const file = new File([JSON.stringify(places)], `codes_${new Date().toISOString().slice(0,10)}.json`, {type: 'application/json'});
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: 'Base Codes', text: 'Backup' })
                .then(() => showToast("Partage réussi", "success"))
                .catch(e => console.log(e));
            } else {
                exportData();
            }
        }
        
        function sharePlaceAsFile(id) {
            const p = places.find(place => place.id === id);
            if (!p) return;

            const exportData = { ...p }; // Clone simple
            const fileName = `lieu_${p.nom_lieu.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
            const file = new File([JSON.stringify(exportData, null, 2)], fileName, {type: 'application/json'});

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: `Lieu: ${p.nom_lieu}`,
                    text: 'Importe ce fichier dans ton Carnet Ambulancier.'
                }).then(() => showToast("Lieu partagé !", "success"))
                  .catch(e => console.log("Annulé", e));
            } else {
                // Fallback: Download
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("Lieu téléchargé (Partage non supporté)", "neutral");
            }
        }

        function triggerImport(mode) {
            window.importMode = mode;
            document.getElementById('import-file').click();
        }

        function processImportFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    let dataToImport = [];

                    if (Array.isArray(json)) {
                        dataToImport = json;
                    } else if (typeof json === 'object' && json !== null) {
                        // Support import unitaire (partiel)
                        dataToImport = [json];
                    } else {
                        throw new Error("Format invalide");
                    }
                    
                    // Normalisation identique au loadData
                     const normalized = dataToImport.map(p => ({
                        id: p.id || Math.random().toString(36),
                        nom_lieu: p.nom_lieu || p.nom || "Inconnu",
                        type_lieu: (p.type_lieu || p.type) === 'Maison de retraite / EHPAD' ? 'EHPAD' : (p.type_lieu || p.type || "Autre"),
                        adresse: p.adresse || "",
                        ville: p.ville || "",
                        code_entree_principal: p.code_entree_principal || p.code1 || "",
                        code_secondaire: p.code_secondaire || p.code2 || "",
                        commentaire: p.commentaire || p.note || "",
                        latitude: parseFloat(p.latitude || p.lat),
                        longitude: parseFloat(p.longitude || p.lon),
                        date_maj: p.date_maj || p.updated || new Date().toISOString()
                    }));

                    // --- SECURITE ANTI ECRASEMENT PARTIEL ---
                    if (window.importMode === 'replace') {
                        // Si le fichier importé est petit (< 5 lieux) mais que la base est grosse (> 5 lieux)
                        // C'est probablement une erreur (partage de fichier unique).
                        if (normalized.length < 5 && places.length > 5) {
                            if (!confirm(`⚠️ ALERTE SÉCURITÉ ⚠️\n\nVous êtes sur le point d'EFFACER ${places.length} lieux pour n'en garder que ${normalized.length}.\n\nCeci ressemble à une erreur (Import d'un lieu partagé).\n\nVoulez-vous continuer et TOUT EFFACER ?\n(Annulez pour Fusionner plutôt)`)) {
                                input.value = '';
                                return; // Stop
                            }
                        }

                        if(confirm(`⚠️ ATTENTION : Remplacement total de la base.\n\n${places.length} lieux actuels seront remplacés par ${normalized.length} lieux importés.\n\nContinuer ?`)) {
                            places = normalized;
                            showToast(`Base remplacée (${places.length} lieux)`, "success");
                        }
                    } else {
                        // Mode MERGE INTELLIGENT AVEC DETECTION DE CONFLIT
                        const currentMap = new Map(places.map(p => [p.id, p]));
                        const toAdd = [];
                        let updated = 0;
                        let skipped = 0;
                        
                        for (const p of normalized) {
                            if (!currentMap.has(p.id)) {
                                // Nouveau lieu
                                toAdd.push(p);
                            } else {
                                // Lieu existant : Vérification des conflits (codes différents)
                                const existing = currentMap.get(p.id);
                                const isCodeDifferent = (existing.code_entree_principal !== p.code_entree_principal) || 
                                                        (existing.code_secondaire !== p.code_secondaire);
                                
                                if (isCodeDifferent) {
                                    // Demande à l'utilisateur si conflit de codes
                                    const msg = `⚠️ CONFLIT détecté pour "${p.nom_lieu}"\n\n` +
                                                `VOTRE VERSION :\nCodes: ${existing.code_entree_principal} ${existing.code_secondaire ? '/ ' + existing.code_secondaire : ''}\n\n` +
                                                `NOUVELLE VERSION (Import):\nCodes: ${p.code_entree_principal} ${p.code_secondaire ? '/ ' + p.code_secondaire : ''}\n\n` +
                                                `Voulez-vous REMPLACER votre version par celle du fichier ?`;
                                    
                                    if (confirm(msg)) {
                                        const idx = places.findIndex(x => x.id === p.id);
                                        places[idx] = p;
                                        updated++;
                                    } else {
                                        skipped++;
                                    }
                                } else {
                                    // Codes identiques : on ignore silencieusement
                                    skipped++;
                                }
                            }
                        }

                        places = places.concat(toAdd);
                        const added = toAdd.length;

                        saveData();
                        filterAndRenderPlaces();
                        showToast(`Terminé : +${added} ajoutés, ${updated} mis à jour.`, "success");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Erreur fichier invalide", "error");
                }
                input.value = '';
            };
            reader.readAsText(file);
        }

        function sharePlace(id) {
            const p = places.find(place => place.id === id);
            if (!p) return;
            
            const mapLink = (p.latitude && p.longitude) 
                ? `https://maps.google.com/?q=${p.latitude},${p.longitude}` 
                : `https://maps.google.com/?q=${encodeURIComponent(p.adresse + ' ' + p.ville)}`;

            const text = `🚑 *${p.nom_lieu}* (${p.type_lieu})\n📍 ${p.adresse}, ${p.ville}\n🔢 CODE: ${p.code_entree_principal}\n${p.code_secondaire ? `🔢 Bis: ${p.code_secondaire}\n` : ''}🔗 GPS: ${mapLink}`;
            
            if (navigator.share) {
                navigator.share({ title: p.nom_lieu, text: text }).catch(console.error);
            } else {
                copyCode(text);
            }
        }

        // --- UTILS ---
        function showToast(msg, type = 'neutral') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const message = document.getElementById('toast-message');
            
            toast.classList.remove('hidden', 'flex');
            toast.classList.add('flex', 'toast-anim');
            
            if (type === 'success') {
                icon.innerHTML = '<i class="fa-solid fa-check-circle text-green-400 text-xl"></i>';
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-400 text-xl"></i>';
            } else {
                icon.innerHTML = '<i class="fa-solid fa-info-circle text-blue-400 text-xl"></i>';
            }
            
            message.innerText = msg;

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex', 'toast-anim');
            }, 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadData();
            filterAndRenderPlaces();
            updateLocation();
        });
    </script>
</body>
</html>
