<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e63946">
    <title>Carnet de codes Ambulancier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Variables et Thème --- */
        :root {
            /* Thème Clair (Défaut) */
            --color-primary: #e63946;
            --color-secondary: #457b9d;
            --color-bg: #f1faee;
            --color-card-bg: #ffffff;
            --color-text: #1d3557;
            --color-text-light: #666;
            --color-code-bg: #f8f8f8;
            --color-success: #2a9d8f;
            --color-warning: #f77f00;
            --padding-base: 1rem;
            --button-size: 3rem;
            --radius: 0.75rem;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Thème Sombre (Activé via data-theme="dark") */
        [data-theme="dark"] {
            --color-primary: #ff5a68;
            --color-secondary: #6fa2c5;
            --color-bg: #121212;
            --color-card-bg: #1e1e1e;
            --color-text: #e0e0e0;
            --color-text-light: #aaa;
            --color-code-bg: #2d2d2d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            padding-bottom: 80px; /* Espace pour le FAB */
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- En-tête --- */
        .header {
            background-color: var(--color-primary);
            color: white;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            flex-grow: 1;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0 0.5rem;
            line-height: 1;
        }

        /* --- Layout --- */
        .container {
            padding: var(--padding-base);
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- Formulaires & Boutons --- */
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: var(--color-card-bg);
            color: var(--color-text);
        }

        .button {
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .button:active { transform: scale(0.98); }

        .btn-primary { background-color: var(--color-primary); color: white; }
        .btn-secondary { background-color: var(--color-secondary); color: white; }
        .btn-success { background-color: var(--color-success); color: white; }
        .btn-danger { background-color: var(--color-warning); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid currentColor; color: inherit; }
        .btn-whatsapp { background-color: #25D366; color: white; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
        .btn-block { width: 100%; }

        /* --- Cartes et Sections --- */
        .card {
            background-color: var(--color-card-bg);
            padding: 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            transition: background-color 0.3s;
        }

        .section-header {
            border-bottom: 1px solid var(--color-secondary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            color: var(--color-secondary);
            font-weight: 600;
        }

        /* --- Liste des Lieux --- */
        .place-card {
            background-color: var(--color-card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            overflow: hidden;
            border-left: 5px solid var(--color-primary);
            transition: background-color 0.3s;
        }

        .place-content { padding: 1rem; }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .place-title h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--color-text);
        }
        .place-city {
            color: var(--color-text-light);
            font-size: 0.9rem;
        }

        .place-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .badge {
            background-color: var(--color-secondary);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .distance-badge {
            margin-top: 4px;
            font-weight: bold;
            color: var(--color-primary);
            font-size: 0.9rem;
        }

        .codes-block {
            background-color: var(--color-code-bg);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin: 0.75rem 0;
            font-family: monospace;
            border: 1px dashed #ccc;
        }

        .code-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }
        .code-row:last-child { margin-bottom: 0; }
        .code-label { font-weight: bold; color: var(--color-text-light); font-size: 0.9rem; }
        .code-value { font-size: 1.1rem; color: var(--color-text); font-weight: 700; }

        .place-actions {
            background-color: rgba(0,0,0,0.03);
            padding: 0.5rem 1rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        /* --- Modale --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--color-card-bg);
            margin: 10% auto;
            padding: 0;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }
        
        .modal-header {
            background-color: var(--color-secondary);
            color: white;
            padding: 1rem;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body { padding: 1.5rem; }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- FAB (Floating Action Button) --- */
        .fab {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background-color: var(--color-primary);
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4);
            border: none;
            cursor: pointer;
            z-index: 90;
            transition: transform 0.2s;
        }
        .fab:hover { transform: scale(1.1); }

        /* --- Toast Notification --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 0.9rem;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* Utilitaires */
        .hidden { display: none; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
    </style>
    
    <script>
        (function() {
            const storedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedTheme === 'dark' || (!storedTheme && systemDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div style="width: 2rem;"></div>
        <div class="header-title">
            <span>🚑</span>
            <span>Carnet Ambulancier</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer le thème">
            🌓
        </button>
    </div>

    <div class="container">
        <!-- Status & GPS (Restauré pour la compatibilité avec le script d'origine) -->
        <div class="card">
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="font-size: 0.9rem; font-weight: 600; color: var(--color-secondary);">
                    <span id="location-text">Position actuelle : Recherche en cours...</span>
                    <span id="last-update-text"></span>
                </div>
                <div style="font-size: 0.75rem; color: var(--color-primary);">
                    ⚠️ GPS : Nécessite HTTPS ou file://
                </div>
                <button class="button btn-secondary btn-sm" onclick="updateLocation()" style="width: 100%;">Actualiser ma position</button>
            </div>
        </div>

        <!-- Recherche -->
        <div class="card">
            <input type="text" id="search-input" placeholder="Rechercher (nom, ville, digicode...)" oninput="filterAndRenderPlaces()">
            <div class="filter-grid">
                <select id="type-filter" onchange="filterAndRenderPlaces()">
                    <option value="">Tous types</option>
                    <option value="Hôpital">Hôpital</option>
                    <option value="Clinique">Clinique</option>
                    <option value="Résidence">Résidence</option>
                    <option value="Maison de retraite / EHPAD">Maison de retraite / EHPAD</option>
                    <option value="Parking">Parking</option>
                    <option value="Autre">Autre</option>
                </select>
                <select id="dist-filter" onchange="filterAndRenderPlaces()">
                    <option value="0">Toute distance</option>
                    <option value="2"> < 2 km</option>
                    <option value="10"> < 10 km</option>
                    <option value="50"> < 50 km</option>
                </select>
            </div>
        </div>

        <!-- Outils Data -->
        <div style="text-align: center; margin-bottom: 1rem;">
             <button class="button btn-outline btn-sm" onclick="toggleDataTools()">
                ⚙️ Partage & Sauvegarde
             </button>
        </div>
        <div id="data-tools" class="card hidden">
            <div class="section-header">Gestion des Données</div>
            <p style="font-size: 0.8rem; margin-bottom:1rem">
                Partagez votre base avec vos collègues ou sauvegardez-la.
            </p>
            
            <div style="display:flex; flex-direction:column; gap:0.5rem">
                <!-- Export / Partage Global -->
                <div style="display:flex; gap:0.5rem">
                    <button class="button btn-whatsapp btn-block" onclick="shareGlobalData()">
                        📤 Partager la base
                    </button>
                    <button class="button btn-secondary btn-block" onclick="exportData()">
                        💾 Télécharger
                    </button>
                </div>

                <hr style="width:100%; border:0; border-top:1px dashed #ccc; margin: 0.5rem 0;">

                <!-- Import -->
                <p style="font-size:0.8rem; margin:0; font-weight:bold">Importer un fichier :</p>
                <div style="display:flex; gap:0.5rem">
                    <button class="button btn-primary btn-block" onclick="triggerImport('merge')">
                        🔄 Fusionner (Sans écraser)
                    </button>
                    <button class="button btn-danger btn-block" onclick="triggerImport('replace')">
                        ⚠️ Remplacer tout
                    </button>
                </div>
            </div>
            
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="processImportFile(this)">
        </div>

        <!-- Liste -->
        <div id="places-list"></div>
        <div id="empty-state" class="hidden" style="text-align: center; padding: 2rem; color: var(--color-text-light);">
            Aucun lieu trouvé.
        </div>
    </div>

    <!-- FAB Add -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Modal Formulaire -->
    <div id="place-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">Nouveau Lieu</span>
                <span onclick="closeModal()" style="cursor:pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div class="modal-body">
                <form id="place-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="place-id">
                    
                    <label>Nom & Type *</label>
                    <input type="text" id="nom_lieu" required placeholder="Ex: Résidence Les Lilas">
                    <select id="type_lieu" required>
                        <option value="Hôpital">Hôpital</option>
                        <option value="Clinique">Clinique</option>
                        <option value="Résidence" selected>Résidence</option>
                        <option value="Maison de retraite / EHPAD">Maison de retraite / EHPAD</option>
                        <option value="Parking">Parking</option>
                        <option value="Autre">Autre</option>
                    </select>

                    <label>Adresse & Ville</label>
                    <input type="text" id="adresse" placeholder="12 rue de la Paix">
                    <input type="text" id="ville" placeholder="Paris">

                    <label style="color: var(--color-primary); font-weight:bold;">Codes d'accès *</label>
                    <div style="display:flex; gap:0.5rem">
                        <input type="text" id="code_entree_principal" required placeholder="Principal (Portail)" style="font-weight:bold;">
                        <input type="text" id="code_secondaire" placeholder="Secondaire (Hall)">
                    </div>

                    <label>Note / Commentaire</label>
                    <textarea id="commentaire" rows="2" placeholder="Ex: Batiment B, 3ème étage, ascenseur gauche"></textarea>

                    <label>Position GPS</label>
                    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                        <input type="number" id="latitude" step="any" placeholder="Lat">
                        <input type="number" id="longitude" step="any" placeholder="Lon">
                        <button type="button" class="button btn-secondary" onclick="fillGPS()">📍 Moi</button>
                    </div>

                    <div style="display:flex; gap:1rem; margin-top:1rem;">
                        <button type="button" class="button btn-outline btn-block" onclick="closeModal()">Annuler</button>
                        <button type="submit" class="button btn-success btn-block">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast">Notification</div>

    <script>
        // --- GESTION DU THEME ---
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }

        // --- CONSTANTES ET ETAT ---
        // Utilisation de var pour éviter l'erreur "already declared" lors des rechargements
        var places = [];
        var currentPosition = null;
        var storageAvailable = true;
        var importMode = 'merge'; 

        // Elements DOM pour le GPS
        var locationTextEl = document.getElementById('location-text');
        var lastUpdateTextEl = document.getElementById('last-update-text');

        // --- SAFE STORAGE INIT ---
        try {
            const stored = localStorage.getItem('ambu_codes_db');
            places = stored ? JSON.parse(stored) : [];
            
            // Migration automatique si nécessaire
            let migrationNeeded = false;
            places = places.map(p => {
                if (p.nom && !p.nom_lieu) {
                    migrationNeeded = true;
                    return {
                        id: p.id,
                        nom_lieu: p.nom,
                        type_lieu: p.type === 'EHPAD' ? 'Maison de retraite / EHPAD' : p.type,
                        adresse: p.adresse || "",
                        ville: p.ville || "",
                        code_entree_principal: p.code1 || "",
                        code_secondaire: p.code2 || "",
                        commentaire: p.note || "",
                        latitude: p.lat,
                        longitude: p.lon,
                        date_maj: p.updated || new Date().toISOString()
                    };
                }
                return p;
            });

            if (migrationNeeded) {
                console.log("Migration des données effectuée.");
                localStorage.setItem('ambu_codes_db', JSON.stringify(places));
            }

        } catch (e) {
            console.error("Erreur d'accès au LocalStorage:", e);
            storageAvailable = false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!storageAvailable) showToast("⚠️ Mode Privé : Pas de sauvegarde !");
            updateLocation();
            renderPlaces(); // Appel initial
        });

        // --- SYSTEME GPS D'ORIGINE (Restauré) ---
        
        function degToRad(deg) {
            return deg * (Math.PI / 180);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Rayon de la Terre déplacé ici pour éviter les erreurs globales
            if (lat1 === null || lon1 === null || lat2 === null || lon2 === null) {
                return Infinity;
            }

            const dLat = degToRad(lat2 - lat1);
            const dLon = degToRad(lon2 - lon1);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(degToRad(lat1)) * Math.cos(degToRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // Distance en km
        }

        function updateLocation() {
            if (!navigator.geolocation) {
                locationTextEl.textContent = "Géolocalisation non supportée par votre navigateur.";
                renderPlaces();
                return;
            }

            locationTextEl.textContent = "Position actuelle : Recherche en cours...";
            lastUpdateTextEl.textContent = "";
            currentPosition = null;
            console.log("Tentative de géolocalisation lancée.");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    };
                    
                    const now = new Date();
                    locationTextEl.textContent = `Position OK (Lat: ${currentPosition.lat.toFixed(4)}, Lon: ${currentPosition.lon.toFixed(4)})`;
                    lastUpdateTextEl.textContent = `MàJ: ${now.toLocaleTimeString('fr-FR')}`;
                    filterAndRenderPlaces();
                    showToast("Position GPS actualisée.");
                    console.log("Géolocalisation réussie:", currentPosition);
                },
                (error) => {
                    console.error("Erreur de géolocalisation (Code:", error.code, "):", error.message);
                    let errorMessage = "Erreur de géolocalisation : ";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage += "Accès refusé.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage += "Position indisponible.";
                            break;
                        case error.TIMEOUT:
                            errorMessage += "Délai expiré.";
                            break;
                        default:
                            errorMessage += "Erreur inconnue.";
                            break;
                    }
                    locationTextEl.textContent = errorMessage;
                    lastUpdateTextEl.textContent = "Tri par nom.";
                    currentPosition = null;
                    filterAndRenderPlaces();
                    showToast(errorMessage);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function fillGPS() {
            if(currentPosition) {
                document.getElementById('latitude').value = currentPosition.lat.toFixed(6);
                document.getElementById('longitude').value = currentPosition.lon.toFixed(6);
            } else {
                updateLocation();
                showToast("Réessayez la localisation...");
            }
        }

        // --- LOGIQUE METIER ---
        function saveDB() {
            if (storageAvailable) {
                try {
                    localStorage.setItem('ambu_codes_db', JSON.stringify(places));
                } catch (e) {
                    showToast("Erreur de sauvegarde !");
                }
            }
            renderPlaces();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('place-id').value;
            const data = {
                id: id || Date.now().toString(36) + Math.random().toString(36).substr(2),
                nom_lieu: document.getElementById('nom_lieu').value,
                type_lieu: document.getElementById('type_lieu').value,
                adresse: document.getElementById('adresse').value,
                ville: document.getElementById('ville').value,
                code_entree_principal: document.getElementById('code_entree_principal').value,
                code_secondaire: document.getElementById('code_secondaire').value,
                commentaire: document.getElementById('commentaire').value,
                latitude: parseFloat(document.getElementById('latitude').value) || null,
                longitude: parseFloat(document.getElementById('longitude').value) || null,
                date_maj: new Date().toISOString()
            };

            if (id) {
                const idx = places.findIndex(p => p.id === id);
                places[idx] = data;
                showToast("Lieu modifié");
            } else {
                places.push(data);
                showToast("Lieu ajouté");
            }
            
            saveDB();
            closeModal();
            filterAndRenderPlaces();
        }

        function deletePlace(id) {
            if(confirm("Supprimer définitivement ce lieu ?")) {
                places = places.filter(p => p.id !== id);
                saveDB();
                showToast("Lieu supprimé");
                filterAndRenderPlaces();
            }
        }

        function editPlace(id) {
            const p = places.find(place => place.id === id);
            if(!p) return;
            document.getElementById('place-id').value = p.id;
            document.getElementById('nom_lieu').value = p.nom_lieu;
            document.getElementById('type_lieu').value = p.type_lieu;
            document.getElementById('adresse').value = p.adresse || '';
            document.getElementById('ville').value = p.ville || '';
            document.getElementById('code_entree_principal').value = p.code_entree_principal || '';
            document.getElementById('code_secondaire').value = p.code_secondaire || '';
            document.getElementById('commentaire').value = p.commentaire || '';
            document.getElementById('latitude').value = p.latitude || '';
            document.getElementById('longitude').value = p.longitude || '';
            document.getElementById('modal-title').innerText = "Modifier Lieu";
            document.getElementById('place-modal').style.display = 'block';
        }

        // --- RENDER & FILTER ---
        function formatDistance(km) {
            if (typeof km !== 'number' || isNaN(km) || km === Infinity) {
                return '<span class="distance-info">--</span>';
            }
            if (km < 1) return `${Math.round(km * 1000)} m`;
            return `${km.toFixed(1)} km`;
        }

        function filterAndRenderPlaces() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const type = document.getElementById('type-filter').value;
            const maxDist = parseFloat(document.getElementById('dist-filter').value);

            let filtered = places.map(p => {
                let dist = Infinity;
                if (currentPosition && p.latitude !== null && p.longitude !== null) {
                    dist = calculateDistance(
                        currentPosition.lat, currentPosition.lon,
                        parseFloat(p.latitude), parseFloat(p.longitude)
                    );
                }
                return { ...p, _dist: dist };
            });

            filtered = filtered.filter(p => {
                const matchTerm = (p.nom_lieu || "").toLowerCase().includes(term) || 
                                  (p.ville || "").toLowerCase().includes(term) || 
                                  (p.commentaire || "").toLowerCase().includes(term);
                const matchType = !type || p.type_lieu === type;
                const matchDist = maxDist === 0 || p._dist <= maxDist;
                return matchTerm && matchType && matchDist;
            });

            // Tri
            if (currentPosition) {
                filtered.sort((a, b) => a._dist - b._dist);
            } else {
                filtered.sort((a, b) => (a.nom_lieu || "").localeCompare(b.nom_lieu || ""));
            }

            renderPlaces(filtered);
        }

        function renderPlaces(list = null) {
            const data = list || places;
            const container = document.getElementById('places-list');
            container.innerHTML = '';
            
            if(data.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            data.forEach(p => {
                const distDisplay = formatDistance(p._dist);

                const wazeUrl = (p.latitude && p.longitude) ? `https://waze.com/ul?ll=${p.latitude},${p.longitude}&navigate=yes` : null;
                const mapsUrl = (p.latitude && p.longitude) 
                    ? `https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}` 
                    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse + ' ' + p.ville)}`;

                const html = `
                <div class="place-card">
                    <div class="place-content">
                        <div class="place-header">
                            <div class="place-title">
                                <h3>${p.nom_lieu}</h3>
                                <div class="place-city">${p.adresse ? p.adresse + ', ' : ''} ${p.ville}</div>
                            </div>
                            <div class="place-meta">
                                <span class="badge">${p.type_lieu}</span>
                                <span class="distance-badge">${distDisplay}</span>
                            </div>
                        </div>

                        <div class="codes-block">
                            <div class="code-row">
                                <span class="code-label">Portail / Principal</span>
                                <span class="code-value" onclick="copyToClipboard('${p.code_entree_principal}')">
                                    ${p.code_entree_principal} <span style="font-size:0.7rem; font-weight:normal">📋</span>
                                </span>
                            </div>
                            ${p.code_secondaire ? `
                            <div class="code-row">
                                <span class="code-label">Intérieur / Bis</span>
                                <span class="code-value" onclick="copyToClipboard('${p.code_secondaire}')">
                                    ${p.code_secondaire} <span style="font-size:0.7rem; font-weight:normal">📋</span>
                                </span>
                            </div>` : ''}
                        </div>

                        ${p.commentaire ? `<div style="font-style:italic; font-size:0.9rem; color:var(--color-text-light); margin-bottom:0.5rem">📝 ${p.commentaire}</div>` : ''}
                    </div>

                    <div class="place-actions">
                        <button onclick="sharePlace('${p.id}')" class="button btn-sm btn-whatsapp">📤 Partager</button>
                        ${wazeUrl ? `<a href="${wazeUrl}" target="_blank" class="button btn-sm btn-primary">🚙 Waze</a>` : ''}
                        <a href="${mapsUrl}" target="_blank" class="button btn-sm btn-secondary">🗺️ Maps</a>
                        <button onclick="editPlace('${p.id}')" class="button btn-sm btn-outline">✏️</button>
                        <button onclick="deletePlace('${p.id}')" class="button btn-sm btn-danger">🗑️</button>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // --- PARTAGE & OUTILS ---
        function toggleDataTools() {
            document.getElementById('data-tools').classList.toggle('hidden');
        }

        function sharePlace(id) {
            const p = places.find(place => place.id === id);
            if (!p) return;

            const mapLink = (p.latitude && p.longitude) 
                ? `https://www.google.com/maps/search/?api=1&query=${p.latitude},${p.longitude}` 
                : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse + ' ' + p.ville)}`;
            
            const text = `🚑 *INFO ACCÈS AMBULANCE* 🚑\n\n` +
                         `🏥 *${p.nom_lieu}* (${p.type_lieu})\n` +
                         `📍 ${p.adresse}, ${p.ville}\n` +
                         `🔢 *CODE:* ${p.code_entree_principal}\n` +
                         (p.code_secondaire ? `🔢 Code 2: ${p.code_secondaire}\n` : '') +
                         (p.commentaire ? `📝 Note: ${p.commentaire}\n` : '') +
                         `\n🗺️ GPS: ${mapLink}`;

            if (navigator.share) {
                navigator.share({
                    title: `Code ${p.nom_lieu}`,
                    text: text
                }).catch(console.error);
            } else {
                copyToClipboard(text);
                showToast("Infos copiées !");
            }
        }

        // Fonction centralisée pour un format d'export unique et compatible
        function getCleanDataForExport() {
            return places.map(p => ({
                id: p.id,
                nom_lieu: p.nom_lieu || p.nom, // Compatible avec l'ancien format interne si migration incomplète
                type_lieu: p.type_lieu || p.type,
                adresse: p.adresse || "",
                ville: p.ville || "",
                code_entree_principal: p.code_entree_principal || p.code1,
                code_secondaire: p.code_secondaire || p.code2 || "",
                commentaire: p.commentaire || p.note || "",
                latitude: p.latitude || p.lat,
                longitude: p.longitude || p.lon,
                date_maj: p.date_maj || p.updated || new Date().toISOString()
            }));
        }

        function shareGlobalData() {
            const cleanData = getCleanDataForExport();
            const dataStr = JSON.stringify(cleanData, null, 2);
            const fileName = `codes_ambulancier_${new Date().toISOString().slice(0,10)}.json`;
            const file = new File([dataStr], fileName, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: 'Sauvegarde Codes Ambulancier',
                    text: 'Voici ma base de codes mise à jour.'
                }).then(() => showToast("Fichier partagé !"))
                  .catch((err) => {
                      console.error(err);
                      exportData(); 
                  });
            } else {
                exportData();
                showToast("Partage fichier non supporté, téléchargement lancé.");
            }
        }

        function exportData() {
            const cleanData = getCleanDataForExport();
            const dataStr = JSON.stringify(cleanData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", url);
            dlAnchor.setAttribute("download", `codes_ambulancier_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            document.body.removeChild(dlAnchor);
            URL.revokeObjectURL(url);
        }

        function triggerImport(mode) {
            importMode = mode;
            document.getElementById('import-file').click();
        }

        function processImportFile(input) {
            const file = input.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if(!Array.isArray(json)) throw new Error("Format invalide : le fichier doit être une liste.");
                    
                    // Validation plus souple : accepte soit l'ancien format (nom), soit le nouveau (nom_lieu)
                    const isValid = json.some(item => item.nom_lieu || item.nom || item.code_entree_principal || item.code1);
                    if (!isValid) throw new Error("Structure JSON incompatible ou fichier vide.");

                    // Normalisation des données importées (Conversion ancien -> nouveau format si nécessaire)
                    const normalizedJson = json.map(p => {
                        if (p.nom && !p.nom_lieu) {
                            // C'est un ancien format, on convertit
                            return {
                                id: p.id,
                                nom_lieu: p.nom,
                                type_lieu: p.type === 'EHPAD' ? 'Maison de retraite / EHPAD' : p.type,
                                adresse: p.adresse || "",
                                ville: p.ville || "",
                                code_entree_principal: p.code1 || "",
                                code_secondaire: p.code2 || "",
                                commentaire: p.note || "",
                                latitude: p.lat,
                                longitude: p.lon,
                                date_maj: p.updated || new Date().toISOString()
                            };
                        }
                        // C'est déjà le bon format
                        return p;
                    });

                    if (importMode === 'replace') {
                        if(confirm(`⚠️ ATTENTION : Vous allez remplacer vos ${places.length} lieux par les ${normalizedJson.length} lieux du fichier. Continuer ?`)) {
                            places = normalizedJson;
                            saveDB();
                            showToast(`Base remplacée : ${places.length} lieux.`);
                            filterAndRenderPlaces();
                        }
                    } else {
                        let addedCount = 0;
                        const existingIds = new Set(places.map(p => p.id));
                        
                        normalizedJson.forEach(newItem => {
                            if (!existingIds.has(newItem.id)) {
                                places.push(newItem);
                                addedCount++;
                            }
                        });
                        
                        saveDB();
                        showToast(`Fusion terminée : +${addedCount} nouveaux lieux.`);
                        filterAndRenderPlaces();
                    }
                } catch(ex) { 
                    alert("Erreur de lecture : " + ex.message); 
                }
                input.value = ''; 
            };
            reader.readAsText(file);
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Copié !");
            } catch (err) {
                showToast("Erreur copie");
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const x = document.getElementById("toast");
            x.className = "show";
            x.innerText = msg;
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Modal
        function openModal() {
            document.getElementById('place-form').reset();
            document.getElementById('place-id').value = '';
            document.getElementById('modal-title').innerText = "Nouveau Lieu";
            document.getElementById('place-modal').style.display = 'block';
            fillGPS();
        }
        function closeModal() {
            document.getElementById('place-modal').style.display = 'none';
        }
        window.onclick = function(event) {
            if (event.target == document.getElementById('place-modal')) closeModal();
        }
    </script>
</body>
